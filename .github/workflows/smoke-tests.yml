name: Daily Smoke Tests

on:
  schedule:
    # 8:00 AM IST = 02:30 AM UTC
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'prod'
        type: choice
        options:
          - staging
          - preprod
          - prod

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache enabled, requires package-lock.json to be committed
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Env Sanity Check
        run: |
          echo "Checking Secrets (will print 'true' if set, 'false' if empty):"
          echo "PROD_BASE_URL is set: ${{ secrets.PROD_BASE_URL != '' }}"
          echo "PROD_ADMIN_USER is set: ${{ secrets.PROD_ADMIN_USER != '' }}"
          echo "PROD_ADMIN_PASS is set: ${{ secrets.PROD_ADMIN_PASS != '' }}"
          echo "CYPRESS_RECORD_KEY is set: ${{ secrets.CYPRESS_RECORD_KEY != '' }}"

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          record: true
          parallel: false
          env: environment=${{ github.event.inputs.environment || 'prod' }},grep=@smoke
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYPRESS_ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          PROD_ADMIN_USER: ${{ secrets.PROD_ADMIN_USER }}
          PROD_ADMIN_PASS: ${{ secrets.PROD_ADMIN_PASS }}
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_PORT: ${{ secrets.PROD_DB_PORT }}
          PROD_CLICKPOST_API_KEY: ${{ secrets.PROD_CLICKPOST_API_KEY }}
          PROD_CLICKPOST_SHIPMENT_API_USERNAME: ${{ secrets.PROD_CLICKPOST_SHIPMENT_API_USERNAME }}
          PROD_CLICKPOST_SHIPMENT_API_PASSWORD: ${{ secrets.PROD_CLICKPOST_SHIPMENT_API_PASSWORD }}
          PROD_X_API_KEY: ${{ secrets.PROD_X_API_KEY }}
          # Also set standard Cypress env vars as fallbacks
          CYPRESS_BASE_URL: ${{ secrets.PROD_BASE_URL }}

      - name: Upload Cypress Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports
          path: cypress/reports/html
          retention-days: 30
